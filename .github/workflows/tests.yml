{"name": "tests", "on": ["push", "pull_request"], "jobs": {"test": {"runs-on": "${{ matrix.os }}", "strategy": {"fail-fast": false, "matrix": {"os": ["ubuntu-24.04", "macos-latest", "windows-latest"], "python-version": ["3.9", "3.12", "3.13"]}}, "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "${{ matrix.python-version }}"}}, {"name": "Install test dependencies", "run": "python -m pip install pytest"}, {"name": "Run tests", "run": "python -m pytest -q"}, {"name": "Install the package", "run": "python -m pip install ."}, {"name": "Smoke-test the installed command", "shell": "bash", "run": "cd \"$RUNNER_TEMP\"\nprintf 'SELECT 1;\\n' > ok.sql\nprintf 'DROP TABLE users;\\n' > bad.sql\nschemasafe ok.sql\nrc=0\nschemasafe bad.sql || rc=$?\ntest \"$rc\" -eq 1\nrc=0\nschemasafe --min-severity high ok.sql bad.sql --format json || rc=$?\ntest \"$rc\" -eq 1\nrc=0\nschemasafe missing.sql || rc=$?\ntest \"$rc\" -eq 2\n"}]}}}

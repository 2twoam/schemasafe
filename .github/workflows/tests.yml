name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -c "import sys; sys.path.insert(0, 'tests'); import test_scanner as m; print(m.test_every_rule_fires(), m.test_safe_sql_not_flagged())"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "schemasafe"
version = "0.1.0"
description = "Offline scanner for risky PostgreSQL migration statements"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
schemasafe = "schemasafe.cli:main"

[tool.setuptools]
packages = ["schemasafe"]
